spring:
  application:
    name: authservice
  datasource:
    url: jdbc:mariadb://localhost:3306/authdb
    username: authuser
    password: authpass
    driver-class-name: org.mariadb.jdbc.Driver

springdoc:
  swagger-ui:
    path: /api-docs.html
  override-with-generic-response: false

management:
  endpoint:
    health:
      show-details: always

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MariaDBDialect